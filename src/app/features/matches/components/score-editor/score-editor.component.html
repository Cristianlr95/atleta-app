<div class="score-editor">
  <div class="team-score">
    <span>{{ homeLabel }}</span>
    <div class="controls">
      <button type="button" class="score-btn" [attr.aria-label]="'Restar gol a ' + homeLabel" (click)="decrementHome()"><img class="atleta-raster-icon" [src]="removeIconAsset" aria-hidden="true" alt="" /></button>
      <strong>{{ homeScore }}</strong>
      <button type="button" class="score-btn" [attr.aria-label]="'Sumar gol a ' + homeLabel" (click)="incrementHome()"><img class="atleta-raster-icon" [src]="addIconAsset" aria-hidden="true" alt="" /></button>
    </div>
  </div>

  <span class="separator">:</span>

  <div class="team-score">
    <span>{{ awayLabel }}</span>
    <div class="controls">
      <button type="button" class="score-btn" [attr.aria-label]="'Restar gol a ' + awayLabel" (click)="decrementAway()"><img class="atleta-raster-icon" [src]="removeIconAsset" aria-hidden="true" alt="" /></button>
      <strong>{{ awayScore }}</strong>
      <button type="button" class="score-btn" [attr.aria-label]="'Sumar gol a ' + awayLabel" (click)="incrementAway()"><img class="atleta-raster-icon" [src]="addIconAsset" aria-hidden="true" alt="" /></button>
    </div>
  </div>
</div>
