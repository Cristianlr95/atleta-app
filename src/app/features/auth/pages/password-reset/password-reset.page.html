<ion-content class="password-reset-bg">
  <div class="password-reset-container">
    <app-metallic-card [title]="confirmMode ? 'Nueva contraseña' : 'Recuperar contraseña'">
      <form *ngIf="!confirmMode" class="password-reset-form" [formGroup]="requestForm" (ngSubmit)="onSubmitRequest()">
        <p>Ingresa tu correo. La respuesta será la misma exista o no la cuenta.</p>
        <app-metallic-input formControlName="email" label="Email" type="email" placeholder="tu@email.com"></app-metallic-input>
        <app-metallic-button type="submit" variant="primary" [disabled]="requestForm.invalid || submitting">
          {{ submitting ? 'Enviando...' : 'Enviar enlace' }}
        </app-metallic-button>
      </form>

      <form *ngIf="confirmMode" class="password-reset-form" [formGroup]="confirmForm" (ngSubmit)="onSubmitConfirmation()">
        <p>El enlace es de un solo uso. Al guardar se cerrarán tus sesiones anteriores.</p>
        <app-metallic-input formControlName="password" label="Nueva contraseña" type="password" allowPasswordToggle></app-metallic-input>
        <app-metallic-input formControlName="confirmation" label="Confirmar contraseña" type="password" allowPasswordToggle></app-metallic-input>
        <app-metallic-button type="submit" variant="primary" [disabled]="confirmForm.invalid || submitting">
          {{ submitting ? 'Guardando...' : 'Guardar contraseña' }}
        </app-metallic-button>
      </form>

      <p *ngIf="message" class="password-reset-message">{{ message }}</p>
      <p *ngIf="error" class="password-reset-error">{{ error }}</p>
      <button type="button" class="password-reset-link" [disabled]="submitting" (click)="onBackToLogin()">Volver al inicio de sesión</button>
    </app-metallic-card>
  </div>
</ion-content>
