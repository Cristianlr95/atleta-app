<nav class="metallic-bottom-nav" aria-label="Navegación inferior">
  <button
    *ngFor="let item of items"
    type="button"
    [attr.data-main-nav-route]="routeHref(item.id)"
    class="metallic-bottom-nav__item"
    [attr.aria-label]="item.label"
    [attr.aria-current]="item.active ? 'page' : null"
    [class.metallic-bottom-nav__item--active]="item.active"
    [class.metallic-bottom-nav__item--cta]="item.variant === 'cta'">
    <img
      [src]="resolveIconAsset(item)"
      class="atleta-game-icon atleta-game-icon--nav atleta-raster-icon"
      aria-hidden="true" alt="" />
    <span
      class="metallic-bottom-nav__badge"
      *ngIf="(item.badgeCount ?? 0) > 0"
      [attr.aria-label]="badgeAriaLabel(item)">
      {{ formatBadgeCount(item.badgeCount) }}
    </span>
    <span>{{ item.label }}</span>
  </button>
</nav>
