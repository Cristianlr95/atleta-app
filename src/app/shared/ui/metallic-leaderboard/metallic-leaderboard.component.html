<div class="leaderboard">
  <header class="leaderboard__header">
    <img class="atleta-raster-icon" [src]="podiumIconAsset" aria-hidden="true" alt="" />
    <h3>{{ title }}</h3>
  </header>

  <div class="leaderboard__table-wrap" *ngIf="rows.length > 0">
    <table class="leaderboard__table">
      <thead>
        <tr>
          <th class="leaderboard__rank-heading">#</th>
          <th>Jugador</th>
          <th *ngIf="showRole">Posición</th>
          <th>OVR</th>
          <th class="leaderboard__matches-heading">PJ</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of rows" [class.leaderboard__row--current]="isCurrent(row)">
          <td class="leaderboard__rank">
            <span *ngIf="isPodium(row)" class="leaderboard__medal" [class]="'leaderboard__medal leaderboard__medal--' + row.rank">
              <img class="atleta-raster-icon" [src]="medalIconAsset" aria-hidden="true" alt="" />
              <span>{{ row.rank }}</span>
            </span>
            <span *ngIf="!isPodium(row)">{{ row.rank }}</span>
          </td>
          <td>
            <p class="leaderboard__alias">{{ row.alias }}</p>
            <p *ngIf="row.metaText" class="leaderboard__row-meta">{{ row.metaText }}</p>
          </td>
          <td *ngIf="showRole" class="leaderboard__role">{{ row.roleText || '—' }}</td>
          <td class="leaderboard__score">{{ row.scoreText }}</td>
          <td class="leaderboard__matches">{{ row.matchesPlayed ?? '—' }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <p *ngIf="rows.length === 0" class="leaderboard__empty">Sin datos de ranking.</p>
</div>
