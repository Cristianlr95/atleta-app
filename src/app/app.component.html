<ion-app>
  <ion-router-outlet></ion-router-outlet>
  <ion-toast
    [isOpen]="!!latestUnread()"
    [header]="latestUnread()?.title ?? ''"
    [message]="latestUnread()?.message ?? ''"
    [buttons]="notificationToastButtons"
    cssClass="atleta-notification-toast"
    duration="2800"
    position="bottom"
    (didDismiss)="onToastDismissed()">
  </ion-toast>
</ion-app>
