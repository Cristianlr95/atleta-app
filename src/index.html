<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>Atleta</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <style>
    .startup { min-height: 100vh; display: grid; place-content: center; padding: 1.5rem; background: #101c24; color: #f4faf6; text-align: center; font: 16px/1.5 system-ui, sans-serif; }
    .startup p { max-width: 28rem; margin: .5rem 0; }
    .startup strong { font-size: 1.25rem; }
  </style>

  <link rel="icon" type="image/png" href="assets/brand/atleta-app-icon-v1.png" />
  <link rel="apple-touch-icon" href="assets/brand/atleta-app-icon-v1.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <app-root>
    <div class="startup" role="status" aria-live="polite">
      <strong>Abriendo Atleta</strong>
      <p>Estamos conectando. Si el servidor estaba inactivo, puede tardar unos minutos.</p>
    </div>
  </app-root>
</body>

</html>
